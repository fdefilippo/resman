name: Scheduled fuzzing

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Generated-input fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      FUZZTIME: 2m
      GOCACHE: ${{ runner.temp }}/resman-go-build
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate fuzz inputs
        shell: bash
        run: |
          set -o pipefail
          make fuzz FUZZTIME="$FUZZTIME" 2>&1 | tee fuzz.log

      - name: Preserve fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            fuzz.log
            **/testdata/fuzz/**
            ${{ runner.temp }}/resman-go-build/fuzz/**
