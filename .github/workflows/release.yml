name: Release packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          tag_version=${GITHUB_REF_NAME#v}
          make_version=$(awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' Makefile)
          spec_version=$(awk '$1 == "Version:" { print $2; exit }' packaging/rpm/resman.spec)
          main_version=$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)

          if [[ "$tag_version" != "$make_version" && "$tag_version" != "${make_version}.0" ]]; then
            echo "tag version $tag_version does not match project version $make_version" >&2
            exit 1
          fi
          if [[ "$spec_version" != "$make_version" ]]; then
            echo "RPM version $spec_version does not match Makefile version $make_version" >&2
            exit 1
          fi
          if [[ "$main_version" != "$make_version" ]]; then
            echo "main.go version $main_version does not match Makefile version $make_version" >&2
            exit 1
          fi

  quality:
    needs: validate-version
    uses: ./.github/workflows/quality.yml

  deb:
    name: Build DEB
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential dpkg-dev

      - name: Build Debian package
        run: make deb

      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          package=$(find build/deb -maxdepth 1 -type f -name 'resman_*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          packaging/layout/verify-package-layout.sh "$package"

          # Prove every legacy-member rejection against a real mutated DEB.
          mutation_dir=$(mktemp -d /tmp/resman-deb-layout.XXXXXX)
          trap 'rm -rf -- "$mutation_dir"' EXIT
          dpkg-deb --raw-extract "$package" "$mutation_dir/package"

          assert_mutation_rejected() {
            mutation_name=$1
            expected_error=$2
            mutated_package="$mutation_dir/resman-$mutation_name.deb"
            dpkg-deb --build --root-owner-group "$mutation_dir/package" "$mutated_package"
            if mutation_output=$(packaging/layout/verify-package-layout.sh "$mutated_package" 2>&1); then
              echo "$mutation_name unexpectedly passed the package layout verifier" >&2
              exit 1
            fi
            case "$mutation_output" in
              *"$expected_error"*) ;;
              *) echo "$mutation_output" >&2; exit 1 ;;
            esac
          }

          legacy_config=/etc/resman.conf
          ln -s /etc/resman/resman.conf "$mutation_dir/package$legacy_config"
          assert_mutation_rejected legacy-symlink "package layout retained legacy path: $legacy_config"
          rm -f -- "$mutation_dir/package$legacy_config"

          legacy_temp=/etc/resman.conf.tmp
          install -m 0600 /dev/null "$mutation_dir/package$legacy_temp"
          assert_mutation_rejected legacy-temp "package layout retained legacy path: $legacy_temp"
          rm -f -- "$mutation_dir/package$legacy_temp"

          legacy_timestamped_backup=/etc/resman.conf.backup_ci_mutation
          install -m 0600 /dev/null "$mutation_dir/package$legacy_timestamped_backup"
          assert_mutation_rejected legacy-timestamped-backup "package layout retained a legacy path beginning with: /etc/resman.conf.backup_"
          rm -f -- "$mutation_dir/package$legacy_timestamped_backup"

          cpu_points_map="$mutation_dir/package/etc/resman/cpu-points.map"
          saved_cpu_points_map="$mutation_dir/cpu-points.map"
          conffiles="$mutation_dir/package/DEBIAN/conffiles"
          saved_conffiles="$mutation_dir/conffiles"
          install -m 0600 "$cpu_points_map" "$saved_cpu_points_map"
          install -m 0644 "$conffiles" "$saved_conffiles"

          rm -f -- "$cpu_points_map"
          sed -i '\|^/etc/resman/cpu-points.map$|d' "$conffiles"
          assert_mutation_rejected cpu-points-missing "package layout is missing: /etc/resman/cpu-points.map -rw------- root/root"
          install -m 0600 "$saved_cpu_points_map" "$cpu_points_map"
          install -m 0644 "$saved_conffiles" "$conffiles"

          chmod 0644 "$cpu_points_map"
          assert_mutation_rejected cpu-points-unsafe-mode "package layout is missing: /etc/resman/cpu-points.map -rw------- root/root"
          chmod 0600 "$cpu_points_map"

          rm -f -- "$cpu_points_map"
          ln -s /etc/resman/resman.conf "$cpu_points_map"
          sed -i '\|^/etc/resman/cpu-points.map$|d' "$conffiles"
          assert_mutation_rejected cpu-points-symlink "package layout is missing: /etc/resman/cpu-points.map -rw------- root/root"
          rm -f -- "$cpu_points_map"
          install -m 0600 "$saved_cpu_points_map" "$cpu_points_map"
          install -m 0644 "$saved_conffiles" "$conffiles"

          mv "$cpu_points_map" "$mutation_dir/package/etc/resman/cpu-points.yaml"
          sed -i '\|^/etc/resman/cpu-points.map$|d' "$conffiles"
          assert_mutation_rejected cpu-points-divergent-path "package layout is missing: /etc/resman/cpu-points.map -rw------- root/root"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/deb/resman_*.deb
          if-no-files-found: error

  rpm:
    name: Build RPM on Enterprise Linux ${{ matrix.major }}
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: "8"
            dist: el8
            image: quay.io/rockylinux/rockylinux:8.10
            repo_base: https://dl.rockylinux.org/pub/rocky/8
            max_glibc: "2.28"
            artifact: rpm-package-el8
          - major: "9"
            dist: el9
            image: quay.io/rockylinux/rockylinux:9.6
            repo_base: https://dl.rockylinux.org/pub/rocky/9
            max_glibc: "2.34"
            artifact: rpm-package-el9
          - major: "10"
            dist: el10
            image: quay.io/rockylinux/rockylinux:10.0
            repo_base: https://dl.rockylinux.org/pub/rocky/10
            max_glibc: "2.39"
            artifact: rpm-package-el10
    env:
      EXPECTED_DIST: ${{ matrix.dist }}
      MAX_GLIBC: ${{ matrix.max_glibc }}
      ROCKY_REPO_BASE: ${{ matrix.repo_base }}
      RPMBUILD_DIR: /tmp/resman-rpmbuild-${{ matrix.dist }}-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ${{ matrix.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install RPM build tools
        run: |
          arch=$(uname -m)
          dnf clean all
          dnf install --assumeyes \
            --setopt=baseos.mirrorlist= \
            --setopt=baseos.baseurl="$ROCKY_REPO_BASE/BaseOS/$arch/os/" \
            --setopt=appstream.mirrorlist= \
            --setopt=appstream.baseurl="$ROCKY_REPO_BASE/AppStream/$arch/os/" \
            --setopt=extras.enabled=0 \
            --setopt=install_weak_deps=False \
            gcc \
            git \
            glibc-devel \
            groff-base \
            gzip \
            make \
            openssl \
            rpm-build \
            systemd \
            systemd-rpm-macros \
            tar

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build RPM package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e "$RPMBUILD_DIR"
          make RPMBUILD_DIR="$RPMBUILD_DIR" rpm

      - name: Collect and verify RPM package
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/rpm/collect-release-artifacts.sh "$RPMBUILD_DIR" build/release
          binary_package=$(find build/release -maxdepth 1 -type f -name 'resman-*.rpm' ! -name '*.src.rpm' -print -quit)
          source_package=$(find build/release -maxdepth 1 -type f -name 'resman-*.src.rpm' -print -quit)
          test -n "$binary_package"
          test -n "$source_package"

          version=$(awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' Makefile)
          release=$(awk '$1 == "RELEASE" && $2 == "=" { print $3; exit }' Makefile)
          expected_binary="resman-${version}-${release}.${EXPECTED_DIST}.x86_64.rpm"
          expected_source="resman-${version}-${release}.${EXPECTED_DIST}.src.rpm"
          if [[ $(basename "$binary_package") != "$expected_binary" ]]; then
            echo "expected binary RPM $expected_binary, found $(basename "$binary_package")" >&2
            exit 1
          fi
          if [[ $(basename "$source_package") != "$expected_source" ]]; then
            echo "expected source RPM $expected_source, found $(basename "$source_package")" >&2
            exit 1
          fi

          rpm --checksig "$binary_package" "$source_package"
          rpm --query --package --info "$binary_package" "$source_package"
          rpm --query --package --list "$binary_package"
          packaging/layout/verify-package-layout.sh "$binary_package"

          glibc_versions=$(
            rpm --query --package --requires "$binary_package" |
              sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p'
          )
          test -n "$glibc_versions"
          max_glibc=$(printf '%s\n' "$glibc_versions" | sort --version-sort | tail -n 1)
          if [[ "$(printf '%s\n' "$MAX_GLIBC" "$max_glibc" | sort --version-sort | tail -n 1)" != "$MAX_GLIBC" ]]; then
            echo "RPM requires GLIBC_$max_glibc, newer than the $EXPECTED_DIST baseline GLIBC_$MAX_GLIBC" >&2
            exit 1
          fi

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/release/resman-*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - deb
      - rpm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-package*"
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum resman_*.deb resman-*.rpm > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          deb_assets=(release-assets/resman_*.deb)
          rpm_assets=(release-assets/resman-*.rpm)
          if (( ${#deb_assets[@]} != 1 || ${#rpm_assets[@]} != 6 )); then
            echo "expected one DEB, three binary RPMs and three source RPMs, found ${#deb_assets[@]} DEB and ${#rpm_assets[@]} RPM assets" >&2
            exit 1
          fi

          for dist in el8 el9 el10; do
            binary_assets=(release-assets/resman-*."$dist".x86_64.rpm)
            source_assets=(release-assets/resman-*."$dist".src.rpm)
            if (( ${#binary_assets[@]} != 1 || ${#source_assets[@]} != 1 )); then
              echo "expected one binary and one source RPM for $dist, found ${#binary_assets[@]} binary and ${#source_assets[@]} source RPMs" >&2
              exit 1
            fi
          done

          assets=("${deb_assets[@]}" "${rpm_assets[@]}" release-assets/SHA256SUMS)
          if (( ${#assets[@]} != 8 )); then
            echo "expected one DEB, six RPMs and SHA256SUMS, found ${#assets[@]} assets" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r existing; do
              case "$existing" in
                resman-*.rpm|resman_*.deb)
                  keep=false
                  for asset in "${assets[@]}"; do
                    if [[ "$(basename "$asset")" == "$existing" ]]; then
                      keep=true
                      break
                    fi
                  done
                  if [[ "$keep" == false ]]; then
                    gh release delete-asset "$GITHUB_REF_NAME" "$existing" \
                      --yes \
                      --repo "$GITHUB_REPOSITORY"
                  fi
                  ;;
              esac
            done < <(
              gh release view "$GITHUB_REF_NAME" \
                --json assets \
                --jq '.assets[].name' \
                --repo "$GITHUB_REPOSITORY"
            )

            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "resman ${GITHUB_REF_NAME#v}" \
              --repo "$GITHUB_REPOSITORY"
          fi
