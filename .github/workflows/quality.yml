name: Reusable quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shipped-asset quality tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes prometheus xz-utils

          archive="$(mktemp --suffix=.tar.xz)"
          extracted="$(mktemp --directory)"
          trap 'rm -rf -- "$archive" "$extracted"' EXIT
          curl --fail --location --show-error --silent \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --xz --file "$archive" --directory "$extracted"
          sudo install -m 0755 \
            "$extracted/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          installed_version=$(shellcheck --version | awk '$1 == "version:" { print $2; exit }')
          test "$installed_version" = "$SHELLCHECK_VERSION"

      - name: Install pinned golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make lint-install

      - name: Run shared quality gates
        env:
          REQUIRE_SHELLCHECK: "1"
        run: make ci-quality GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"
