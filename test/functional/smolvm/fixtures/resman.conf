# Per-run paths are expanded by run-functional.sh inside the guest.
CGROUP_ROOT=/sys/fs/cgroup
CGROUP_BASE=resman-functional-@RUN_ID@
CREATED_CGROUPS_FILE=/var/lib/resman-functional/@RUN_ID@/cgroups.txt
METRICS_CACHE_FILE=/var/lib/resman-functional/@RUN_ID@/metrics.cache

POLLING_INTERVAL=5
MIN_ACTIVE_TIME=5
METRICS_CACHE_TTL=1
METRICS_REFRESH_INTERVAL=5
PROCESS_MIN_AGE_SECONDS=0

CPU_THRESHOLD=100
CPU_RELEASE_THRESHOLD=1
CPU_THRESHOLD_DURATION=0
CPU_QUOTA_NORMAL="max 100000"
CPU_QUOTA_LIMITED="50000 100000"
USER_INCLUDE_LIST=
USER_EXCLUDE_LIST=root
PROCESS_EXCLUDE_LIST=^systemd$,^dbus-daemon$,^dbus-broker$,^polkitd$
MIN_SYSTEM_CORES=2
IGNORE_SYSTEM_LOAD=true

RAM_LIMIT_ENABLED=true
RAM_THRESHOLD=2
RAM_RELEASE_THRESHOLD=1
RAM_QUOTA_LIMITED=256M
RAM_QUOTA_PER_USER=128M
RAM_USER_INCLUDE_LIST=^resman-memory$
RAM_USER_EXCLUDE_LIST=root

IO_LIMIT_ENABLED=true
IO_THRESHOLD=2
IO_RELEASE_THRESHOLD=1
IO_READ_BPS=10M
IO_WRITE_BPS=10M
IO_READ_IOPS=100
IO_WRITE_IOPS=100
IO_DEVICE_FILTER=all
IO_THRESHOLD_DURATION=0
IO_USER_INCLUDE_LIST=^resman-io$
IO_USER_EXCLUDE_LIST=root

ENABLE_PROMETHEUS=true
PROMETHEUS_METRICS_BIND_HOST=127.0.0.1
PROMETHEUS_METRICS_BIND_PORT=19100
PROMETHEUS_AUTH_TYPE=none
PROMETHEUS_TLS_ENABLED=false

MCP_ENABLED=false
MCP_TRANSPORT=http
MCP_HTTP_HOST=127.0.0.1
MCP_HTTP_PORT=19101
MCP_AUTH_TOKEN=functional-harness-only
MCP_ALLOW_WRITE_OPS=true

METRICS_DB_ENABLED=true
METRICS_DB_PATH=/var/lib/resman-functional/@RUN_ID@/metrics.db
METRICS_DB_RETENTION_DAYS=1
METRICS_DB_WRITE_INTERVAL=5

PSI_EVENT_DRIVEN=false
LOG_LEVEL=DEBUG
LOG_FILE=/var/lib/resman-functional/@RUN_ID@/resman.log
LOG_MAX_SIZE=1048576
USE_SYSLOG=false
