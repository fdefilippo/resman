- name: cpu_native_failed
  interval: 30s
  input_series:
  - series: resman_control_cpu_activation_requested{instance="cpu_native_failed"}
    values: 1+0x30
  - series: resman_control_cpu_activation_applied{instance="cpu_native_failed"}
    values: 0+0x30
  - series: resman_control_decision_timestamp_seconds{instance="cpu_native_failed"}
    values: 1+30x30
  - series: resman_control_decision_max_age_seconds{instance="cpu_native_failed"}
    values: 90+0x30
  - series: resman_control_decision_suspended_until_timestamp_seconds{instance="cpu_native_failed"}
    values: 0+0x30
  - series: resman_enforcement_mode{instance="cpu_native_failed",mode="systemd_native"}
    values: 1+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: ResManCPULimitsNotActivating
    exp_alerts:
    - exp_labels:
        instance: cpu_native_failed
        severity: warning
        category: operations
      exp_annotations:
        summary: Requested CPU plan is not completely applied
        description: The authoritative decision requests a CPU plan, but native reconciliation
          has not completely verified it. Inspect CPU authority and reconciliation
          errors.
