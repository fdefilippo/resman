rule_files:
- alerting-rules.yml
evaluation_interval: 30s
tests:
- name: disabled
  interval: 30s
  input_series:
  - series: resman_io_block_iops_source_required{instance="disabled"}
    values: 0+0x30
  - series: resman_io_block_iops_source_available{instance="disabled"}
    values: 0+0x30
  - series: resman_io_block_iops_unavailable_users{instance="disabled"}
    values: 4+0x30
  - series: resman_io_block_iops_decision_timestamp_seconds{instance="disabled"}
    values: 1+30x30
  - series: resman_control_decision_max_age_seconds{instance="disabled"}
    values: 90+0x30
  - series: resman_control_decision_suspended_until_timestamp_seconds{instance="disabled"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: ResManBlockIOPSSourceUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSCoverageIncomplete
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSDecisionStale
    exp_alerts: []
- name: healthy
  interval: 30s
  input_series:
  - series: resman_io_block_iops_source_required{instance="healthy"}
    values: 1+0x30
  - series: resman_io_block_iops_source_available{instance="healthy"}
    values: 1+0x30
  - series: resman_io_block_iops_unavailable_users{instance="healthy"}
    values: 0+0x30
  - series: resman_io_block_iops_decision_timestamp_seconds{instance="healthy"}
    values: 1+30x30
  - series: resman_control_decision_max_age_seconds{instance="healthy"}
    values: 90+0x30
  - series: resman_control_decision_suspended_until_timestamp_seconds{instance="healthy"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: ResManBlockIOPSSourceUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSCoverageIncomplete
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSDecisionStale
    exp_alerts: []
- name: source_failed
  interval: 30s
  input_series:
  - series: resman_io_block_iops_source_required{instance="source_failed"}
    values: 1+0x30
  - series: resman_io_block_iops_source_available{instance="source_failed"}
    values: 0+0x30
  - series: resman_io_block_iops_unavailable_users{instance="source_failed"}
    values: 3+0x30
  - series: resman_io_block_iops_decision_timestamp_seconds{instance="source_failed"}
    values: 1+30x30
  - series: resman_control_decision_max_age_seconds{instance="source_failed"}
    values: 90+0x30
  - series: resman_control_decision_suspended_until_timestamp_seconds{instance="source_failed"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: ResManBlockIOPSSourceUnavailable
    exp_alerts:
    - exp_labels:
        instance: source_failed
        severity: warning
        category: io
      exp_annotations:
        summary: Required block-IOPS source unavailable
        description: The latest fresh decision could not certify the required kernel
          source. Inspect source qualification and integrity diagnostics; an unfiltered
          slice total is not a substitute.
  - eval_time: 10m
    alertname: ResManBlockIOPSCoverageIncomplete
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSDecisionStale
    exp_alerts: []
- name: coverage_missing
  interval: 30s
  input_series:
  - series: resman_io_block_iops_source_required{instance="coverage_missing"}
    values: 1+0x30
  - series: resman_io_block_iops_source_available{instance="coverage_missing"}
    values: 1+0x30
  - series: resman_io_block_iops_unavailable_users{instance="coverage_missing"}
    values: 3+0x30
  - series: resman_io_block_iops_decision_timestamp_seconds{instance="coverage_missing"}
    values: 1+30x30
  - series: resman_control_decision_max_age_seconds{instance="coverage_missing"}
    values: 90+0x30
  - series: resman_control_decision_suspended_until_timestamp_seconds{instance="coverage_missing"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: ResManBlockIOPSSourceUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSCoverageIncomplete
    exp_alerts:
    - exp_labels:
        instance: coverage_missing
        severity: warning
        category: io
      exp_annotations:
        summary: Block-IOPS release coverage incomplete
        description: 3 eligible users lack a complete certified interval. Activation
          minima may remain usable; a missing release maximum is unknown, never zero.
          Initial user baselines can cause temporary gaps.
  - eval_time: 10m
    alertname: ResManBlockIOPSDecisionStale
    exp_alerts: []
- name: stale
  interval: 30s
  input_series:
  - series: resman_io_block_iops_source_required{instance="stale"}
    values: 1+0x30
  - series: resman_io_block_iops_source_available{instance="stale"}
    values: 0+0x30
  - series: resman_io_block_iops_unavailable_users{instance="stale"}
    values: 3+0x30
  - series: resman_io_block_iops_decision_timestamp_seconds{instance="stale"}
    values: 1+0x30
  - series: resman_control_decision_max_age_seconds{instance="stale"}
    values: 90+0x30
  - series: resman_control_decision_suspended_until_timestamp_seconds{instance="stale"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: ResManBlockIOPSSourceUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSCoverageIncomplete
    exp_alerts: []
  - eval_time: 10m
    alertname: ResManBlockIOPSDecisionStale
    exp_alerts:
    - exp_labels:
        instance: stale
        severity: warning
        category: io
      exp_annotations: &id001
        summary: Block-IOPS decision evidence is stale
        description: No fresh decision evidence within three effective fallback intervals.
          Source status is historical; inspect control-cycle failures. Intentional
          blackout suppresses this alert.
