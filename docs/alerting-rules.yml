# ResMan - Prometheus Alerting Rules
# Validate with: promtool check rules docs/alerting-rules.yml
#
# Load this file from the rule_files section of your Prometheus configuration.
# See: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
#
# Usage:
#   1. Copy this file to your Prometheus rules directory
#   2. Add to prometheus.yml:
#      rule_files:
#        - "/path/to/alerting-rules.yml"
#   3. Reload Prometheus: kill -HUP <pid>
#
# Per-user series are published from resman's authoritative control-cycle sample.
# Observation-only refreshes do not overwrite these alert inputs.

groups:
  # ============================================================================
  # CRITICAL ALERTS - Immediate attention required
  # ============================================================================
  - name: resman_critical
    interval: 30s

    rules:
      # -------------------------------------------------------------------------
      # User CPU Critical
      # -------------------------------------------------------------------------
      - alert: ResManUserCPUCritical
        expr: resman_user_cpu_usage_percent > 95
        for: 5m
        labels:
          severity: critical
          category: cpu
        annotations:
          summary: "User {{ $labels.username }} CPU usage critical"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) CPU usage is {{ $value | printf \"%.1f\" }}% for more than 5 minutes."
          dashboard: "https://grafana.example.com/d/resman-dashboard"

      # -------------------------------------------------------------------------
      # User Memory Critical
      # -------------------------------------------------------------------------
      - alert: ResManUserMemoryCritical
        expr: resman_user_memory_usage_bytes > 4294967296  # 4GB
        for: 10m
        labels:
          severity: critical
          category: memory
        annotations:
          summary: "User {{ $labels.username }} memory usage critical"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) is using {{ $value | humanize1024 }} of memory for more than 10 minutes."
          dashboard: "https://grafana.example.com/d/resman-dashboard"

      # -------------------------------------------------------------------------
      # System Overload
      # -------------------------------------------------------------------------
      - alert: ResManSystemOverload
        expr: (resman_system_load_average / resman_cpu_total_cores) > 3
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "System load critical"
          description: "System load per CPU core is {{ $value | printf \"%.2f\" }} (load: {{ $value | printf \"%.2f\" }}, cores: {{ $labels.instance }}) for more than 5 minutes."

      # -------------------------------------------------------------------------
      # Too Many Processes
      # -------------------------------------------------------------------------
      - alert: ResManTooManyProcesses
        expr: resman_user_process_count > 500
        for: 5m
        labels:
          severity: critical
          category: processes
        annotations:
          summary: "User {{ $labels.username }} has too many processes"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) has {{ $value }} processes running for more than 5 minutes."

  # ============================================================================
  # WARNING ALERTS - Should be investigated soon
  # ============================================================================
  - name: resman_warnings
    interval: 30s

    rules:
      # -------------------------------------------------------------------------
      # User CPU High
      # -------------------------------------------------------------------------
      - alert: ResManUserCPUHigh
        expr: resman_user_cpu_usage_percent > 75
        for: 10m
        labels:
          severity: warning
          category: cpu
        annotations:
          summary: "User {{ $labels.username }} CPU usage high"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) CPU usage is {{ $value | printf \"%.1f\" }}% for more than 10 minutes."
          dashboard: "https://grafana.example.com/d/resman-dashboard"

      # -------------------------------------------------------------------------
      # User Memory High
      # -------------------------------------------------------------------------
      - alert: ResManUserMemoryHigh
        expr: resman_user_memory_usage_bytes > 2147483648  # 2GB
        for: 15m
        labels:
          severity: warning
          category: memory
        annotations:
          summary: "User {{ $labels.username }} memory usage high"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) is using {{ $value | humanize1024 }} of memory for more than 15 minutes."
          dashboard: "https://grafana.example.com/d/resman-dashboard"

      # -------------------------------------------------------------------------
      # Memory Growth Rate
      # -------------------------------------------------------------------------
      - alert: ResManMemoryGrowthRate
        expr: deriv(resman_user_memory_usage_bytes[5m]) * 60 > 524288000  # 500MB/min
        for: 10m
        labels:
          severity: warning
          category: memory
        annotations:
          summary: "User {{ $labels.username }} memory growing rapidly"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) memory is growing at {{ $value | humanize1024 }}/min. Possible memory leak."

      # -------------------------------------------------------------------------
      # Process Count High
      # -------------------------------------------------------------------------
      - alert: ResManProcessCountHigh
        expr: resman_user_process_count > 200
        for: 10m
        labels:
          severity: warning
          category: processes
        annotations:
          summary: "User {{ $labels.username }} process count high"
          description: "User {{ $labels.username }} (UID: {{ $labels.uid }}) has {{ $value }} processes running."
          dashboard: "https://grafana.example.com/d/resman-dashboard"

      # -------------------------------------------------------------------------
      # System Load High
      # -------------------------------------------------------------------------
      - alert: ResManSystemLoadHigh
        expr: (resman_system_load_average / resman_cpu_total_cores) > 1.5
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "System load high"
          description: "System load per CPU core is {{ $value | printf \"%.2f\" }} for more than 10 minutes."
          dashboard: "https://grafana.example.com/d/resman-dashboard"

  # ============================================================================
  # OPERATIONAL ALERTS - Service health monitoring
  # ============================================================================
  - name: resman_operations
    interval: 30s

    rules:
      # -------------------------------------------------------------------------
      # CPU Limits Not Activating
      # -------------------------------------------------------------------------
      - alert: ResManCPULimitsNotActivating
        expr: resman_all_users_cpu_usage_percent > 80 and resman_cpu_limits_active == 0
        for: 5m
        labels:
          severity: warning
          category: operations
        annotations:
          summary: "CPU limits not activating despite high usage"
          description: "User CPU usage is {{ $value | printf \"%.1f\" }}% but CPU limits are not active. Check configuration."

      # -------------------------------------------------------------------------
      # Frequent CPU Limit Toggling
      # -------------------------------------------------------------------------
      - alert: ResManFrequentCPULimitToggling
        expr: (increase(resman_cpu_limits_activated_total[10m]) + increase(resman_cpu_limits_deactivated_total[10m])) > 5
        for: 0m
        labels:
          severity: warning
          category: operations
        annotations:
          summary: "CPU limits toggling frequently"
          description: "CPU limits changed state {{ $value }} times in the last 10 minutes. Check threshold configuration."

      # -------------------------------------------------------------------------
      # Control Cycle Too Slow
      # -------------------------------------------------------------------------
      - alert: ResManControlCycleSlow
        expr: (rate(resman_control_cycle_duration_seconds_sum[5m]) / rate(resman_control_cycle_duration_seconds_count[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "ResMan control cycle too slow"
          description: "Average control cycle duration is {{ $value | printf \"%.1f\" }} seconds. Expected < 10 seconds."

      # -------------------------------------------------------------------------
      # High Error Rate
      # -------------------------------------------------------------------------
      - alert: ResManHighErrorRate
        expr: sum(increase(resman_errors_total[5m])) > 10
        for: 0m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "ResMan error rate high"
          description: "{{ $value }} errors in the last 5 minutes. Check logs for details."

      # -------------------------------------------------------------------------
      # Required Procfs Access Unavailable
      # -------------------------------------------------------------------------
      - alert: ResManProcFSAccessIncomplete
        expr: sum by (cluster, environment, hostname, server_role, access) (resman_procfs_unavailable_processes) > 0
        for: 2m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "ResMan cannot read required process data"
          description: "{{ $value }} processes lack {{ $labels.access }} procfs access; enforcement decisions are conservative."

      # -------------------------------------------------------------------------
      # Service Down
      # -------------------------------------------------------------------------
      - alert: ResManServiceDown
        expr: absent(up{job="resman"} == 1)
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "ResMan service is down"
          description: "ResMan service has been down for more than 1 minute."

  # ============================================================================
  # INFO ALERTS - Informational notifications
  # ============================================================================
  - name: resman_info
    interval: 60s

    rules:
      # -------------------------------------------------------------------------
      # New Active User
      # -------------------------------------------------------------------------
      - alert: ResManNewActiveUser
        expr: changes(resman_all_users_count[5m]) > 0
        for: 0m
        labels:
          severity: info
          category: operations
        annotations:
          summary: "Active users count changed"
          description: "Number of active users changed. Current count: {{ $value }}."

      # -------------------------------------------------------------------------
      # CPU Limits Activated
      # -------------------------------------------------------------------------
      - alert: ResManCPULimitsActivated
        expr: increase(resman_cpu_limits_activated_total[5m]) > 0
        for: 0m
        labels:
          severity: info
          category: operations
        annotations:
          summary: "CPU limits activated"
          description: "CPU limits were activated {{ $value }} time(s) in the last 5 minutes."

      # -------------------------------------------------------------------------
      # CPU Limits Deactivated
      # -------------------------------------------------------------------------
      - alert: ResManCPULimitsDeactivated
        expr: increase(resman_cpu_limits_deactivated_total[5m]) > 0
        for: 0m
        labels:
          severity: info
          category: operations
        annotations:
          summary: "CPU limits deactivated"
          description: "CPU limits were deactivated {{ $value }} time(s) in the last 5 minutes."

# ============================================================================
# INHIBITION RULES (for Alertmanager)
# ============================================================================
# Add these to your alertmanager.yml:
#
# inhibit_rules:
#   # If critical CPU alert is firing, suppress warning CPU alert
#   - source_match:
#       severity: 'critical'
#     target_match:
#       severity: 'warning'
#     equal: ['alertname', 'uid']
#
#   # If service is down, suppress all other alerts
#   - source_match:
#       alertname: 'ResManServiceDown'
#     target_match_re:
#       alertname: '.+'
#     equal: ['instance']
